services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiv
      POSTGRES_PASSWORD: aiv
      POSTGRES_DB: ai_visibility
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiv -d ai_visibility"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://aiv:aiv@db:5432/ai_visibility
      FLASK_APP: wsgi.py
      FLASK_ENV: production
    ports:
      - "5000:5000"

volumes:
  pgdata:
